trigger:
  branches:
    include:
      - basePlatform
  paths:
    include:
      - terraform/*
      - src/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - basePlatform
  paths:
    include:
      - terraform/*
      - src/*

variables:
  - name: RG_MONTECARLO
    value: 'montecarlo'
  - name: terraformVersion
    value: '1.6.0'
  - name: pythonVersion
    value: '3.11'
  - name: environment
    value: 'dev'

pool:
  vmImage: 'ubuntu-latest'

stages:

  # STAGE 1: CI BUILD
  - stage: CI_Build
    displayName: 'Continuous Integration'
    jobs:
      - job: Build_Applications
        displayName: 'Build Producer Function'
        steps:
        - checkout: self
        - task: UsePythonVersion@0
          displayName: 'Use Python $(pythonVersion)'
          inputs:
            versionSpec: '$(pythonVersion)'
        - script: |
            cd src/producer
            pip install --upgrade pip
            pip install -r requirements.txt --target .python_packages/lib/site-packages
            # Run tests if they exist
            if [ -f "tests/test_function.py" ]; then
              echo "Running tests..."
              python -m pytest tests/ --junitxml=test-results.xml --cov=. --cov-report=xml || true
            else
              echo "No tests found, skipping..."
            fi
          displayName: 'Install dependencies and run tests'
        - task: PublishTestResults@2
          condition: succeededOrFailed()
          inputs:
            testResultsFiles: '**/test-results.xml'
            testRunTitle: 'Producer Function Tests'
        - task: ArchiveFiles@2
          displayName: 'Archive Producer Function'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)/src/producer'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/producer-function.zip'
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Function Artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'function-apps'
            publishLocation: 'Container'

  # STAGE 2: INFRASTRUCTURE DEPLOYMENT
  - stage: Infrastructure_Deploy
    displayName: 'Infrastructure Deployment'
    jobs:
      - job: Deploy_Infrastructure
        displayName: 'Deploy Fresh Azure Infrastructure'
        steps:
        - checkout: self
        - task: TerraformInstaller@0
          displayName: 'Install Terraform $(terraformVersion)'
          inputs:
            terraformVersion: $(terraformVersion)
        - task: TerraformTaskV4@4
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            backendServiceArm: 'montecarlo-service-connection'
            backendAzureRmResourceGroupName: 'rg-terraform-state'
            backendAzureRmStorageAccountName: 'sttfstatemontecarlo2025'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'montecarlo.terraform.tfstate'
        - task: TerraformTaskV4@4
          displayName: 'Terraform Apply'
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            environmentServiceNameAzureRM: 'montecarlo-service-connection'
        - task: TerraformTaskV4@4
          displayName: 'Terraform Output'
          inputs:
            provider: 'azurerm'
            command: 'output'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            commandOptions: '-json'
            environmentServiceNameAzureRM: 'montecarlo-service-connection'
          name: 'terraformOutputs'
        - task: PowerShell@2
          displayName: 'Parse Terraform Outputs'
          inputs:
            targetType: 'inline'
            script: |
              $outputs = terraform output -json | ConvertFrom-Json
              $functionName = $outputs.producer_name.value
              $functionUrl = $outputs.producer_default_hostname.value
              Write-Host "Function Name: $functionName"
              Write-Host "Function URL: $functionUrl"
              Write-Host "##vso[task.setvariable variable=functionName;isOutput=true]$functionName"
              Write-Host "##vso[task.setvariable variable=functionUrl;isOutput=true]https://$functionUrl"
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
          name: 'setOutputs'

  # STAGE 3: APPLICATION DEPLOYMENT
  - stage: Application_Deploy
    displayName: 'Application Deployment'
    dependsOn:
      - Infrastructure_Deploy
      - CI_Build
    condition: succeeded()
    variables:
      functionName: $[ stageDependencies.Infrastructure_Deploy.Deploy_Infrastructure.outputs['setOutputs.functionName'] ]
      functionUrl: $[ stageDependencies.Infrastructure_Deploy.Deploy_Infrastructure.outputs['setOutputs.functionUrl'] ]
    jobs:
      - deployment: Deploy_Producer
        displayName: 'Deploy Producer Function'
        environment: 'montecarlo-$(environment)'
        strategy:
          runOnce:
            deploy:
              steps:
              - download: current
                artifact: function-apps
                displayName: 'Download Function Artifacts'
              - task: AzureFunctionApp@1
                displayName: 'Deploy Producer Function'
                inputs:
                  azureSubscription: 'montecarlo-service-connection'
                  appType: 'functionAppLinux'
                  appName: '$(functionName)'
                  package: '$(Pipeline.Workspace)/function-apps/producer-function.zip'
                  runtimeStack: 'PYTHON|3.11'
                  deploymentMethod: 'zipDeploy'
              - task: PowerShell@2
                displayName: 'Test Function Deployment'
                inputs:
                  targetType: 'inline'
                  script: |
                    $baseUrl = "$(functionUrl)"
                    if ($baseUrl -notlike "https://*") {
                        $baseUrl = "https://$baseUrl"
                    }
                    $healthEndpoint = "$baseUrl/api/health"
                    Write-Host "Testing HealthCheck Function at: $healthEndpoint"
                    Start-Sleep -Seconds 30
                    $maxAttempts = 5
                    $attempt = 1
                    while ($attempt -le $maxAttempts) {
                        try {
                            Write-Host "Health check attempt $attempt/$maxAttempts"
                            $response = Invoke-RestMethod -Uri $healthEndpoint -Method Get -TimeoutSec 30
                            Write-Host "✅ HealthCheck function is available!"
                            Write-Host "Response: $($response | ConvertTo-Json -Compress)"
                            exit 0
                        }
                        catch {
                            Write-Warning "Health check attempt $attempt failed: $($_.Exception.Message)"
                            if ($attempt -eq $maxAttempts) {
                                Write-Error "❌ HealthCheck function failed after $maxAttempts attempts"
                                exit 1
                            }
                            Start-Sleep -Seconds 10
                        }
                        $attempt++
                    }

  # STAGE 4: LANCE PRODUCER
  - stage: Producer_Run
    displayName: 'Lance Producer'
    dependsOn:
      - Application_Deploy
    condition: succeeded()
    variables:
      functionUrl: $[ stageDependencies.Infrastructure_Deploy.Deploy_Infrastructure.outputs['setOutputs.functionUrl'] ]
    jobs:
      - job: Run_Producer
        displayName: 'Trigger Producer Function'
        steps:
          - task: PowerShell@2
            displayName: 'Trigger Producer Function'
            inputs:
              targetType: 'inline'
              script: |
                $baseUrl = "$(functionUrl)"
                if ($baseUrl -notlike "https://*") {
                    $baseUrl = "https://$baseUrl"
                }
                $functionEndpoint = "$baseUrl/api/start"
                Write-Host "Triggering Producer Function at: $functionEndpoint"
                $response = Invoke-RestMethod -Uri $functionEndpoint -Method POST -TimeoutSec 300
                Write-Host "Response: $($response | ConvertTo-Json -Compress)"

